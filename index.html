<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح الأباجورة التفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* سلك الأباجورة */
        .lamp-cord {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 120px;
            background: #444;
            transform: translateX(-50%);
            transition: all 0.4s ease;
        }

        /* الأباجورة (زر تفاعلي متقدم) */
        .lamp-bulb {
            position: absolute;
            top: 120px;
            left: 50%;
            width: 45px;
            height: 45px;
            background: #ffeb3b;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 50px 20px rgba(255, 235, 59, 0.6);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .lamp-bulb:hover {
            transform: translateX(-50%) scale(1.08);
            box-shadow: 0 0 70px 25px rgba(255, 235, 59, 0.8);
        }

        .lamp-bulb:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* حالة إطفاء الأباجورة */
        .lamp-bulb.off {
            background: #4a4a5a;
            box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.8);
            border-color: #2a2a35;
        }

        /* صندوق تسجيل الدخول (مخفي افتراضياً) */
        .login-card {
            position: absolute;
            top: 55%;
            background: rgba(20, 20, 28, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            width: 380px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* إظهار صندوق تسجيل الدخول */
        .login-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .login-card h2 {
            margin-bottom: 22px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #8f8f9e;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 14, 0.7);
            color: #fff;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00e676;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.25);
        }

        /* زر متقدم ومميز (غير تقليدي) */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border: none;
            color: #0b0b0e;
            font-weight: bold;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        #error-msg {
            color: #ff5252;
            margin-top: 12px;
            font-size: 13px;
        }

        /* واجهة الترحيب بعد تسجيل الدخول */
        #welcome-screen {
            text-align: center;
            display: none;
        }

        #welcome-screen.show {
            display: block;
        }

        #welcome-screen h1 {
            color: #00e676;
            margin-bottom: 10px;
            font-size: 26px;
        }
    </style>
</head>
<body>

    <!-- سلك والأباجورة -->
    <div class="lamp-cord"></div>
    <div class="lamp-bulb" id="lamp-toggle" title="اضغط لتشغيل/إطفاء المصباح"></div>

    <!-- نافذة تسجيل الدخول (مخفية بالافتراضي) -->
    <div class="login-card" id="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="auth-form">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">دخول للنظام</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <!-- واجهة الموقع بعد تسجيل الدخول -->
    <div id="welcome-screen">
        <h1>مرحباً بك في لوحة التحكم!</h1>
        <p style="color: #a0a0b0;">تم تسجيل الدخول بنجاح عبر فايربيس.</p>
        <button class="submit-btn" id="logout-btn" style="margin-top: 20px; background: linear-gradient(135deg, #ff5252, #ff1744); color: #fff;">تسجيل الخروج</button>
    </div>

    <!-- كود فايربيس والتحكم بالحركة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
          authDomain: "my-store-75b70.firebaseapp.com",
          projectId: "my-store-75b70",
          storageBucket: "my-store-75b70.firebasestorage.app",
          messagingSenderId: "762773021655",
          appId: "1:762773021655:web:a4f70106e4a986c149e192",
          measurementId: "G-C0T08334KV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lampToggle = document.getElementById('lamp-toggle');
        const loginContainer = document.getElementById('login-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        // التفاعل مع الضغط على الأباجورة (إظهار/إطفاء وإظهار/إخفاء نموذج الدخول)
        lampToggle.addEventListener('click', () => {
            // إذا كنا في شاشة الترحيب بعد الدخول، لا نتحكم بالأباجورة
            if (welcomeScreen.classList.contains('show')) return;

            lampToggle.classList.toggle('off');
            loginContainer.classList.toggle('show');
        });

        // عملية تسجيل الدخول عبر فايربيس
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // إخفاء الأباجورة ونموذج الدخول وعرض شاشة الترحيب
                    lampToggle.style.display = 'none';
                    document.querySelector('.lamp-cord').style.display = 'none';
                    loginContainer.classList.remove('show');
                    welcomeScreen.classList.add('show');
                })
                .catch((error) => {
                    errorMsg.textContent = "خطأ: تأكد من صحة البريد أو كلمة المرور.";
                });
        });

        // زر تسجيل الخروج للعودة للحالة الأولية
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                welcomeScreen.classList.remove('show');
                lampToggle.style.display = 'block';
                document.querySelector('.lamp-cord').style.display = 'block';
                lampToggle.classList.remove('off');
                authForm.reset();
                errorMsg.textContent = '';
            });
        });
    </script>
</body>
</html>
