<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تفاعل متقدم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
            color: #fff;
            padding: 20px 0;
        }

        /* سلك الأباجورة */
        .lamp-cord {
            width: 2px;
            height: 80px;
            background: #555;
            flex-shrink: 0;
        }

        /* زر الأباجورة بتفاعل متقدم (مطفأة افتراضياً) */
        .lamp-bulb {
            width: 45px;
            height: 45px;
            background: #25252b;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            border: 2px solid #3a3a45;
            flex-shrink: 0;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }

        .lamp-bulb:hover {
            transform: scale(1.08);
            border-color: #ffc107;
        }

        .lamp-bulb:active {
            transform: scale(0.92);
        }

        /* حالة إضاءة الأباجورة */
        .lamp-bulb.lit {
            background: #ffeb3b;
            box-shadow: 0 0 50px 20px rgba(255, 235, 59, 0.5), inset 0 0 10px rgba(255,255,255,0.8);
            border-color: #fff;
        }

        /* صندوق تسجيل الدخول */
        .login-card {
            background: #1e1e1e;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 360px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .login-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            display: block;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #bbb;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #ffc107;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.3);
        }

        /* زر دخول بتفاعل متقدم وانيميشن استجابة للضغط */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.5);
            background: linear-gradient(135deg, #ffca28, #ffa726);
        }

        .login-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
        }

        #error-message {
            color: #ff5252;
            margin-top: 10px;
            font-size: 13px;
        }

        /* واجهة الموقع بعد تسجيل الدخول */
        #welcome-screen {
            text-align: center;
            display: none;
            margin-top: 20px;
        }
        #welcome-screen.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- سلك والأباجورة -->
    <div class="lamp-cord"></div>
    <div class="lamp-bulb" id="lamp-toggle" title="اضغط لتشغيل المصباح وإظهار نموذج الدخول"></div>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-card" id="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="login-btn">دخول للنظام</button>
            <div id="error-message"></div>
        </form>
    </div>

    <!-- واجهة الموقع بعد تسجيل الدخول -->
    <div id="welcome-screen">
        <h2 style="color: #ffc107; margin-bottom: 10px;">أهلاً بك!</h2>
        <p>تم تسجيل الدخول بنجاح عبر فايربيس.</p>
        <button class="login-btn" id="logout-btn" style="margin-top: 20px; background: linear-gradient(135deg, #ff5252, #e53935); color: #fff; box-shadow: 0 4px 15px rgba(255,82,82,0.3);">تسجيل الخروج</button>
    </div>

    <!-- كود فايربيس والتفاعل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
          authDomain: "my-store-75b70.firebaseapp.com",
          projectId: "my-store-75b70",
          storageBucket: "my-store-75b70.firebasestorage.app",
          messagingSenderId: "762773021655",
          appId: "1:762773021655:web:a4f70106e4a986c149e192",
          measurementId: "G-C0T08334KV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lampToggle = document.getElementById('lamp-toggle');
        const loginContainer = document.getElementById('login-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const logoutBtn = document.getElementById('logout-btn');

        // التفاعل المتقدم مع الأباجورة
        lampToggle.addEventListener('click', () => {
            if (welcomeScreen.classList.contains('show')) return;

            lampToggle.classList.toggle('lit');
            loginContainer.classList.toggle('show');
        });

        // تسجيل الدخول عبر فايربيس
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    lampToggle.style.display = 'none';
                    document.querySelector('.lamp-cord').style.display = 'none';
                    loginContainer.classList.remove('show');
                    welcomeScreen.classList.add('show');
                })
                .catch((error) => {
                    errorMessage.textContent = "خطأ في البريد أو كلمة المرور.";
                });
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                welcomeScreen.classList.remove('show');
                lampToggle.style.display = 'block';
                document.querySelector('.lamp-cord').style.display = 'block';
                lampToggle.classList.remove('lit');
                loginForm.reset();
                errorMessage.textContent = '';
            });
        });
    </script>
</body>
</html>
