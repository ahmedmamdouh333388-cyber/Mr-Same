<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أباجورة تفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* سلك الأباجورة */
        .lamp-cord {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 120px;
            background: #444;
            transform: translateX(-50%);
        }

        /* زر الأباجورة (مطفأة افتراضياً) */
        .lamp-bulb {
            position: absolute;
            top: 120px;
            left: 50%;
            width: 40px;
            height: 40px;
            background: #333; /* مطفأة في البداية */
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: none;
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 20;
            border: 2px solid #222;
        }

        /* حالة إضاءة الأباجورة عند الضغط عليها */
        .lamp-bulb.lit {
            background: #ffeb3b;
            box-shadow: 0 0 50px 20px rgba(255, 235, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* صندوق تسجيل الدخول (مخفي تماماً بالبداية) */
        .login-card {
            position: absolute;
            top: 55%;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            width: 350px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            transition: all 0.4s ease;
        }

        /* إظهار صندوق تسجيل الدخول */
        .login-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ffc107;
        }

        /* زر الدخول بتصميم أنيق ومتقدم بدون لون أزرق مزعج */
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #ffc107;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .login-btn:hover {
            background: #e0a800;
        }

        #error-message {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 14px;
        }

        /* واجهة الموقع بعد تسجيل الدخول */
        #welcome-screen {
            text-align: center;
            display: none;
        }
        #welcome-screen.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- سلك والأباجورة -->
    <div class="lamp-cord"></div>
    <div class="lamp-bulb" id="lamp-toggle" title="اضغط لتشغيل المصباح"></div>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-card" id="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="login-btn">دخول</button>
            <div id="error-message"></div>
        </form>
    </div>

    <!-- واجهة الموقع بعد تسجيل الدخول -->
    <div id="welcome-screen">
        <h2 style="color: #ffc107; margin-bottom: 10px;">أهلاً بك في موقعك!</h2>
        <p>تم تسجيل الدخول بنجاح عبر فايربيس.</p>
        <button class="login-btn" id="logout-btn" style="margin-top: 20px; background: #ff4d4d; color: #fff;">تسجيل الخروج</button>
    </div>

    <!-- كود فايربيس والتفاعل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
          authDomain: "my-store-75b70.firebaseapp.com",
          projectId: "my-store-75b70",
          storageBucket: "my-store-75b70.firebasestorage.app",
          messagingSenderId: "762773021655",
          appId: "1:762773021655:web:a4f70106e4a986c149e192",
          measurementId: "G-C0T08334KV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lampToggle = document.getElementById('lamp-toggle');
        const loginContainer = document.getElementById('login-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const logoutBtn = document.getElementById('logout-btn');

        // التفاعل مع الضغط على الأباجورة (تشغيل/إطفاء وإظهار/إخفاء)
        lampToggle.addEventListener('click', () => {
            if (welcomeScreen.classList.contains('show')) return;

            lampToggle.classList.toggle('lit');
            loginContainer.classList.toggle('show');
        });

        // تسجيل الدخول عبر فايربيس
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // إخفاء الأباجورة ونموذج الدخول وعرض الموقع
                    lampToggle.style.display = 'none';
                    document.querySelector('.lamp-cord').style.display = 'none';
                    loginContainer.classList.remove('show');
                    welcomeScreen.classList.add('show');
                })
                .catch((error) => {
                    errorMessage.textContent = "خطأ في البريد أو كلمة المرور.";
                });
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                welcomeScreen.classList.remove('show');
                lampToggle.style.display = 'block';
                document.querySelector('.lamp-cord').style.display = 'block';
                lampToggle.classList.remove('lit');
                loginForm.reset();
                errorMessage.textContent = '';
            });
        });
    </script>
</body>
</html>
