<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مع أباجورة تفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f13;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* سلك الأباجورة */
        .lamp-cord {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100px;
            background: #555;
            transform: translateX(-50%);
        }

        /* زر الأباجورة القابل للضغط لإخفاء وإظهار نافذة الدخول */
        .lamp-bulb {
            position: absolute;
            top: 100px;
            left: 50%;
            width: 40px;
            height: 40px;
            background: #ffeb3b;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 40px 15px rgba(255, 235, 59, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .lamp-bulb:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 60px 25px rgba(255, 235, 59, 0.7);
        }

        /* صندوق تسجيل الدخول */
        .login-card {
            background: rgba(26, 26, 36, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 380px;
            text-align: center;
            z-index: 10;
            margin-top: 50px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        .login-card h2 {
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0b0;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 15, 19, 0.6);
            color: #fff;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
        }

        /* زر متقدم بدون لون أزرق تقليدي */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border: none;
            color: #0f0f13;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 230, 118, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 230, 118, 0.5);
        }

        #error-msg {
            color: #ff5252;
            margin-top: 15px;
            font-size: 13px;
        }

        /* واجهة الموقع بعد تسجيل الدخول بنجاح */
        #welcome-screen {
            text-align: center;
        }

        #welcome-screen h1 {
            color: #00e676;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- سلك وأباجورة تفاعلية -->
    <div class="lamp-cord"></div>
    <div class="lamp-bulb" id="lamp-toggle" title="اضغط هنا لإظهار/إخفاء نافذة الدخول"></div>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-card" id="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="auth-form">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">دخول للنظام</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <!-- واجهة الموقع التي تظهر بعد تسجيل الدخول بنجاح -->
    <div id="welcome-screen" class="hidden">
        <h1>مرحباً بك في لوحة التحكم!</h1>
        <p>تم تسجيل الدخول بنجاح عبر فايربيس.</p>
        <button class="submit-btn" id="logout-btn" style="margin-top: 20px; background: #ff5252; color: #fff;">تسجيل الخروج</button>
    </div>

    <!-- كود فايربيس والتفاعل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAF7j3fuI1PHTW2sUgcRYjQo8J5hwwV4mM",
          authDomain: "my-store-75b70.firebaseapp.com",
          projectId: "my-store-75b70",
          storageBucket: "my-store-75b70.firebasestorage.app",
          messagingSenderId: "762773021655",
          appId: "1:762773021655:web:a4f70106e4a986c149e192",
          measurementId: "G-C0T08334KV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lampToggle = document.getElementById('lamp-toggle');
        const loginContainer = document.getElementById('login-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        // الضغط على الأباجورة لإظهار أو إخفاء صندوق تسجيل الدخول بالعكس
        lampToggle.addEventListener('click', () => {
            if (welcomeScreen.classList.contains('hidden')) {
                loginContainer.classList.toggle('hidden');
            }
        });

        // عملية تسجيل الدخول
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // إخفاء صندوق الدخول وإظهار واجهة الموقع
                    loginContainer.classList.add('hidden');
                    welcomeScreen.classList.remove('hidden');
                })
                .catch((error) => {
                    errorMsg.textContent = "خطأ: تأكد من صحة البريد أو كلمة المرور.";
                });
        });

        // زر تسجيل الخروج للعودة للحالة الطبيعية
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                welcomeScreen.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                authForm.reset();
            });
        });
    </script>
</body>
</html>
